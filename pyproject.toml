[project]
name = "area54"
version = "0.1.0"
description = "A virtual software development team powered by agentic AI"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tools", "tools.evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Eval fixtures are specimens. They carry deliberate defects and must stay
# exactly as written, so they are not ours to lint or format.
exclude = ["evals/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
