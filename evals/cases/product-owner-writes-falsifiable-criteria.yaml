name: product-owner-writes-falsifiable-criteria
agent: product-owner
fixture: vague-roadmap-item
rationale: >
  "Should be quick and feel safe" is not buildable. The PO must convert it into
  criteria someone can test without seeing the implementation, and must surface
  what it could not resolve rather than inventing an answer. Silently deciding
  what "feel safe" means is the failure this case looks for.
trials: 5
threshold: 3
prompt: |
  Groom the roadmap item in ROADMAP_LINE.md into a spec, following your role
  definition exactly. Write the spec to SPEC.md in this directory.
# The PO's role definition tells it to keep its final message a summary for the
# CPO rather than a copy of the file. So the spec is asserted on where it
# actually lives, and stdout is only checked for the things a summary should
# carry. The first version of this case asserted Given/When/Then against stdout
# and failed 0/5 — testing the PO for obeying its own instructions.
expect:
  mentions_any:
    - "accountant"
    - "open question"
  file_contains:
    SPEC.md:
      - "Given"
      - "When"
      - "Then"
      - "Out of scope"
      - "Open questions"
      - "accountant"
