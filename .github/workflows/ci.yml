name: CI

# The team's only trustworthy quality signal. Agents report that tests pass;
# this proves it. Never weaken a check here to unblock a merge.
#
# Stack fixed by docs/adr/0001-stack.md: Python tooling over markdown agent
# definitions. The "Agent and command definitions" step enforces the team's
# structural invariants — model pins, tool scoping, and that every command
# delegates to an agent that exists.
#
# NOTE for the devops agent: third-party actions are still on moving tags and
# should be pinned to commit SHAs. Installation should move to `uv sync
# --frozen` once a uv.lock is committed.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: PR must link a spec
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qE 'docs/specs/TF-[0-9]{3}'; then
            echo "Spec linked."
            exit 0
          fi
          # Chores and tooling changes have no spec. They must say so explicitly,
          # with a reason, so that skipping the gate is a deliberate act.
          if printf '%s' "$BODY" | grep -qE '^No spec: .+'; then
            echo "::notice::Spec gate waived: $(printf '%s' "$BODY" | grep -oE '^No spec: .+')"
            exit 0
          fi
          echo "::error::PR body must link its spec (docs/specs/TF-NNN-*.md), or state 'No spec: <reason>'. See CLAUDE.md."
          exit 1

      - name: No secrets in the diff
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          if git diff "origin/${{ github.base_ref }}"...HEAD -U0 \
             | grep -nEi '^\+.*(api[_-]?key|secret|password|private[_-]?key|BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})' \
             | grep -vEi '(example|placeholder|dummy|fake|test|process\.env|os\.environ|getenv|\$\{)'; then
            echo "::error::Possible secret in the diff. Move it to the environment."
            exit 1
          fi
          echo "No secrets detected."

  checks:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Typecheck
        run: mypy tools tests

      - name: Test
        run: pytest

      # Also the packaging. `claude plugin validate` is the authority on the
      # manifests but needs the CLI and a session, which CI has neither of;
      # tools/plugin.py checks the part that fails silently — manifests that
      # validate and load nothing.
      - name: Agent, command and packaging definitions
        run: python tools/validate.py

      # Loading the eval cases is free and deterministic. Running them is not,
      # and lives in evals.yml.
      - name: Eval cases load
        run: python -m tools.evals --list
